# Site settings
title: "Xuhong He"
email: xuhongh@andrew.cmu.edu
description: >-
  Xuhong He's personal homepage: information retrieval, LLM agents, and multilingual evaluation.
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/New_York
locale: en-US
url: "https://dho233.github.io"
baseurl: ""
cloudflare_web_analytics_token: "6a1cc33bfb07460d87fbbcd283b31060"

include:
  - _pages

exclude:
  - _posts/2010-01-07-post-modified.md
  - _posts/2010-01-07-post-standard.md
  - _posts/2010-01-08-post-chat.md
  - _posts/2010-02-05-post-notice.md
  - _posts/2010-02-05-post-quote.md
  - _posts/2010-03-07-post-link.md
  - _posts/2019-04-18-welcome-to-jekyll.md
  - assets/resume/CV_USInternMLE_Full.pdf

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
